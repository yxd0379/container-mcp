[project]
name = "container-mcp"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "mcp==1.28.1",
  # 2.15 emits an unresolved FastMCP lifespan warning during every CLI startup.
  "pydantic-settings==2.14.2",
]

[dependency-groups]
test = [
  "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
