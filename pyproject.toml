[project]
name = "mcp-dexec"
version = "0.1.0"
description = "Repo-local MCP tool for running commands in the simjoin container."
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.28.1",
]

[dependency-groups]
test = [
  "pytest>=8.0",
]

[project.scripts]
mcp-dexec = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py", "patch_engine.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
